<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 840" width="1620" height="840" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1620" height="840" fill="#FFFFFF"/>

  <text x="810" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">Energy Fabric Platform : architecture médaillon</text>

  <!-- Fabric container -->
  <rect x="270" y="80" width="1320" height="500" rx="14" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="285" y="100" font-size="14" font-weight="bold" fill="#4B5563">Microsoft Fabric (OneLake) : ws-energy-dev / test / prod</text>

  <!-- Column headers -->
  <g font-size="14" font-weight="bold" fill="#6B7280" text-anchor="middle">
    <text x="130" y="108">Sources</text>
    <text x="390" y="124">Ingestion</text>
    <text x="650" y="124">Bronze</text>
    <text x="900" y="124">Silver</text>
    <text x="1150" y="124">Gold</text>
    <text x="1440" y="124">Consommation</text>
  </g>
  <text x="290" y="144" font-size="12" font-style="italic" fill="#2563EB">Flux batch (toutes les heures)</text>
  <text x="290" y="418" font-size="12" font-style="italic" fill="#0F766E">Flux temps réel</text>

  <!-- Sources -->
  <g font-size="13" fill="#111827" text-anchor="middle">
    <rect x="30" y="125" width="200" height="75" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
    <text x="130" y="157" font-weight="bold">API ODRE / RTE</text><text x="130" y="177">éco2mix national</text>
    <rect x="30" y="220" width="200" height="75" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
    <text x="130" y="252" font-weight="bold">API Open-Meteo</text><text x="130" y="272">météo horaire</text>
    <rect x="30" y="450" width="200" height="75" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="130" y="482" font-weight="bold">Capteurs simulés</text><text x="130" y="502">script Python</text>
  </g>

  <!-- Batch row -->
  <g font-size="13" fill="#111827" text-anchor="middle">
    <rect x="290" y="150" width="200" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="390" y="195" font-weight="bold">Data Factory</text><text x="390" y="216">pipelines paramétrés</text><text x="390" y="236">relances + alertes</text>

    <rect x="560" y="150" width="180" height="120" rx="10" fill="#F4E1CE" stroke="#B5651D" stroke-width="2"/>
    <text x="650" y="190" font-weight="bold">lh_bronze</text><text x="650" y="211">données brutes</text><text x="650" y="231">Delta, append</text><text x="650" y="251">colonnes _ingested_at</text>

    <rect x="810" y="150" width="180" height="120" rx="10" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
    <text x="900" y="190" font-weight="bold">lh_silver</text><text x="900" y="211">typage, dédoublonnage</text><text x="900" y="231">contrôles qualité</text><text x="900" y="251">table de rejets</text>

    <rect x="1060" y="150" width="180" height="120" rx="10" fill="#FDF1C7" stroke="#B8860B" stroke-width="2"/>
    <text x="1150" y="190" font-weight="bold">lh_gold</text><text x="1150" y="211">modèle en étoile</text><text x="1150" y="231">faits + dimensions</text>

    <rect x="1310" y="150" width="260" height="120" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <text x="1440" y="195" font-weight="bold">Modèle sémantique</text><text x="1440" y="216">Direct Lake</text><text x="1440" y="236">mesures DAX + RLS</text>

    <rect x="1310" y="320" width="260" height="80" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <text x="1440" y="354" font-weight="bold">Rapport Power BI</text><text x="1440" y="375">mix, météo, qualité</text>
  </g>

  <!-- Real-time row -->
  <g font-size="13" fill="#111827" text-anchor="middle">
    <rect x="290" y="430" width="200" height="110" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="390" y="480" font-weight="bold">Eventstream</text><text x="390" y="501">ingestion temps réel</text>

    <rect x="560" y="430" width="180" height="110" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="650" y="480" font-weight="bold">Eventhouse</text><text x="650" y="501">requêtes KQL</text>

    <rect x="810" y="430" width="180" height="110" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="900" y="480" font-weight="bold">Data Activator</text><text x="900" y="501">règles d'alerte</text>

    <rect x="1060" y="430" width="180" height="110" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
    <text x="1150" y="480" font-weight="bold">Alertes</text><text x="1150" y="501">Teams / e-mail</text>
  </g>

  <!-- Arrows batch -->
  <g stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="230" y1="162" x2="288" y2="185"/>
    <line x1="230" y1="258" x2="288" y2="235"/>
    <line x1="490" y1="210" x2="558" y2="210"/>
    <line x1="740" y1="210" x2="808" y2="210"/>
    <line x1="990" y1="210" x2="1058" y2="210"/>
    <line x1="1240" y1="210" x2="1308" y2="210"/>
    <line x1="1440" y1="270" x2="1440" y2="318"/>
    <!-- real-time -->
    <line x1="230" y1="487" x2="288" y2="487"/>
    <line x1="490" y1="487" x2="558" y2="487"/>
    <line x1="740" y1="487" x2="808" y2="487"/>
    <line x1="990" y1="487" x2="1058" y2="487"/>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="774" y="200">PySpark</text>
    <text x="1024" y="200">SQL</text>
  </g>

  <!-- Transverse band -->
  <text x="30" y="618" font-size="14" font-weight="bold" fill="#6B7280">Transverse</text>
  <g font-size="13" fill="#111827" text-anchor="middle">
    <rect x="30" y="630" width="292" height="150" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
    <text x="176" y="662" font-weight="bold">Entra ID</text>
    <text x="176" y="688">4 groupes, aucun accès individuel</text>
    <text x="176" y="708">rôles de workspace</text>
    <text x="176" y="728">service principal de déploiement</text>
    <text x="176" y="748">RLS sur le modèle sémantique</text>

    <rect x="347" y="630" width="292" height="150" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
    <text x="493" y="662" font-weight="bold">Git et CI/CD</text>
    <text x="493" y="688">GitHub : branches dev, test, main</text>
    <text x="493" y="708">GitHub Actions</text>
    <text x="493" y="728">fabric-cicd</text>

    <rect x="664" y="630" width="292" height="150" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
    <text x="810" y="662" font-weight="bold">Lineage et gouvernance</text>
    <text x="810" y="688">vue lineage Fabric</text>
    <text x="810" y="708">certification du modèle</text>
    <text x="810" y="728">Purview (optionnel)</text>

    <rect x="981" y="630" width="292" height="150" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
    <text x="1127" y="662" font-weight="bold">Observabilité</text>
    <text x="1127" y="688">Monitoring hub</text>
    <text x="1127" y="708">ops_pipeline_runs</text>
    <text x="1127" y="728">ops_quality_results</text>

    <rect x="1298" y="630" width="292" height="150" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
    <text x="1444" y="662" font-weight="bold">Environnements</text>
    <text x="1444" y="688">Dev (branche dev)</text>
    <text x="1444" y="708">Test (branche test)</text>
    <text x="1444" y="728">Prod (branche main)</text>
    <text x="1444" y="748">promotion automatisée</text>
  </g>
  <text x="810" y="815" text-anchor="middle" font-size="12" fill="#6B7280">Source des données : ODRE / RTE éco2mix, Open-Meteo, flux simulé</text>
</svg>
